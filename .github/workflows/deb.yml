name: Build deb

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    # 24.04 on purpose: its the oldest thing that ships hidapi 0.14, and a deb built on it also installs on debian 13
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # the package version has the commit count in it, a shallow clone would lie about that
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make cmake g++ pkg-config file dpkg-dev \
            libhidapi-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Build package
        run: make deb

      - name: Show what is in it
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb

      - name: Install it for real
        run: |
          sudo apt-get install -y ./dist/*.deb
          rockcat-cli --help

      - uses: actions/upload-artifact@v4
        with:
          name: rockcat-swarm-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
